[package]
name = "myrstack"
version = "0.1.0"
edition = "2024"
description = "Native desktop view of the agent fleet running in Orca"
publish = false

[lib]
name = "myrstack"
path = "src/lib.rs"

[[bin]]
name = "myrstack"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.36", features = ["persistence"] }
egui_graphs = "0.32"
petgraph = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
crossbeam-channel = "0.5"
notify = "8.2"
thiserror = "2"
anyhow = "1"
directories = "6"
log = "0.4"
env_logger = "0.11"
jiff = "0.2"
global-hotkey = "0.8"
egui_extras = "0.36"
sherpa-rs = { version = "0.6.8", features = ["static"] }
cpal = "0.18"
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"

# Vendored with a local patch that lets an idle graph view stop repainting every frame.
[patch.crates-io]
egui_graphs = { path = "vendor/egui_graphs" }
