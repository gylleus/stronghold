[package]
name = "stronghold"
version = "0.1.0"
edition = "2024"
description = "Native desktop view of the agent clan running in Orca"
publish = false

[lib]
name = "stronghold"
path = "src/lib.rs"

[[bin]]
name = "stronghold"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.36", features = ["persistence"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
crossbeam-channel = "0.5"
notify = "8.2"
thiserror = "2"
anyhow = "1"
directories = "6"
log = "0.4"
env_logger = "0.11"
jiff = "0.2"
global-hotkey = "0.8"
sherpa-rs = { version = "0.6.8", features = ["static"] }
cpal = "0.18"
sha2 = "0.10"
url = "2"
egui_dock = { version = "0.21", features = ["serde"] }
ron = "0.12"
# Decodes the generated hammer PNG; already in the tree through eframe.
image = { version = "0.25", default-features = false, features = ["png"] }

# Native notifications when running from Stronghold.app (see src/notify/native.rs).
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSBundle", "NSDictionary", "NSError", "NSObject", "NSString"] }
objc2-user-notifications = { version = "0.3", default-features = false, features = ["std", "block2", "bitflags", "UNNotification", "UNNotificationContent", "UNNotificationRequest", "UNNotificationResponse", "UNNotificationSettings", "UNNotificationSound", "UNNotificationTrigger", "UNUserNotificationCenter"] }

[dev-dependencies]
tempfile = "3"
