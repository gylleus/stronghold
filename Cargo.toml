[package]
name = "myrstack"
version = "0.1.0"
edition = "2024"
description = "Native desktop view of the agent fleet running in Orca"
publish = false

[lib]
name = "myrstack"
path = "src/lib.rs"

[[bin]]
name = "myrstack"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.36", features = ["persistence"] }
egui_graphs = "0.32"
petgraph = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
crossbeam-channel = "0.5"
notify = "8.2"
thiserror = "2"
anyhow = "1"
directories = "6"
log = "0.4"
env_logger = "0.11"
jiff = "0.2"
global-hotkey = "0.8"
egui_extras = { version = "0.36", features = ["svg"] }
sherpa-rs = { version = "0.6.8", features = ["static"] }
cpal = "0.18"
sha2 = "0.10"
egui_dock = { version = "0.21", features = ["serde"] }
ron = "0.12"
# Decodes the ant farm's PNG sprites; already in the tree through eframe.
image = { version = "0.25", default-features = false, features = ["png"] }

# Native notifications when running from Myrstack.app (see src/notify/native.rs).
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSBundle", "NSDictionary", "NSError", "NSObject", "NSString"] }
objc2-user-notifications = { version = "0.3", default-features = false, features = ["std", "block2", "bitflags", "UNNotification", "UNNotificationContent", "UNNotificationRequest", "UNNotificationResponse", "UNNotificationSettings", "UNNotificationSound", "UNNotificationTrigger", "UNUserNotificationCenter"] }

[dev-dependencies]
tempfile = "3"
# Screenshots in examples/graph_groups.rs; already in the tree through eframe.
image = { version = "0.25", default-features = false, features = ["png"] }

# Vendored with a local patch that lets an idle graph view stop repainting every frame.
[patch.crates-io]
egui_graphs = { path = "vendor/egui_graphs" }
